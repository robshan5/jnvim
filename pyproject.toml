[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jnvim"
version = "0.1.0"
description = "A terminal Jupyter notebook editor driven by vim motions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "jupyter_client>=7.0",
    "ipykernel>=6.0",
]

[project.scripts]
jnvim = "jnvim.__main__:main"

[tool.setuptools]
packages = ["jnvim"]
